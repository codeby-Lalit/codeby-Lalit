name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate github-contribution-grid-snake
        uses: Platane/snk@v3
        with:
          github_user_name: codeby-Lalit
          outputs: |
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=%2300c4cc&color_dots=%2316191f,%231f3b40,%230f7f88,%2300aab3,%2300c4cc
            dist/github-contribution-grid-snake.svg?color_snake=%23008a94&color_dots=%23ebedf0,%2353d8df,%2300c4cc,%2300aab3,%23008a94

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}